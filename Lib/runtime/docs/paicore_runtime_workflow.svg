<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1180" viewBox="0 0 2000 1180" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision">
  <title id="title">PAIRV PAICORE runtime inference workflow</title>
  <desc id="desc">Four-lane workflow showing the stable sample-level PAICORE runner path and the manual session path for explicit frame and synchronization control.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fa; }
      text { font-family: Arial, "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; letter-spacing: 0; }
      .title { font-size: 30px; font-weight: 700; fill: #18212f; }
      .subtitle { font-size: 17px; font-weight: 400; fill: #556173; }
      .lane-title { font-size: 18px; font-weight: 700; fill: #263244; }
      .box-title { font-size: 17px; font-weight: 700; fill: #17212e; }
      .box-text { font-size: 15px; font-weight: 400; fill: #425066; }
      .api { font-size: 15px; font-weight: 600; fill: #233247; }
      .small { font-size: 15px; font-weight: 400; fill: #59677a; }
      .label { font-size: 15px; font-weight: 600; fill: #334155; }
      .step { font-size: 15px; font-weight: 700; fill: #fff; text-anchor: middle; dominant-baseline: central; }
      .lane { stroke: #d8dee8; stroke-width: 1; }
      .box { stroke-width: 1.5; rx: 7; }
      .app { fill: #e8f1ff; stroke: #4b78b8; }
      .codec { fill: #e8f7ef; stroke: #3b8461; }
      .session { fill: #fff3dd; stroke: #b57928; }
      .core { fill: #f2eafb; stroke: #7650a5; }
      .event { fill: #fff; stroke: #8793a3; stroke-width: 1.2; stroke-dasharray: 6 5; rx: 7; }
      .runner-boundary { fill: none; stroke: #3b8461; stroke-width: 1.5; stroke-dasharray: 7 5; rx: 8; }
      .manual-boundary { fill: #fff; fill-opacity: 0.42; stroke: #8793a3; stroke-width: 1.3; stroke-dasharray: 7 5; rx: 8; }
      .chip-app { fill: #dbeafe; stroke: #4b78b8; stroke-width: 1; rx: 5; }
      .chip-session { fill: #ffedd5; stroke: #b57928; stroke-width: 1; rx: 5; }
      .chip-codec { fill: #dcfce7; stroke: #3b8461; stroke-width: 1; rx: 5; }
      .step-app { fill: #4b78b8; }
      .step-codec { fill: #3b8461; }
      .step-session { fill: #b57928; }
      .arrow { fill: none; stroke: #3c4858; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .manual-arrow { fill: none; stroke: #667386; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 7 5; marker-end: url(#arrow-muted); }
      .divider { stroke: #cbd3df; stroke-width: 1; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3c4858"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#667386"/>
    </marker>
  </defs>

  <rect class="bg" width="2000" height="1180"/>
  <text class="title" x="52" y="51">PAIRV Runtime 控制 PAICORE 推理的主要工作流程</text>
  <text class="subtitle" x="52" y="82">Runner 提供完整样本接口；应用持有工件、输入输出与缓冲区，Runtime 管理帧编码、NoC、IRQ 和同步</text>

  <!-- Four retained swimlanes. -->
  <rect class="lane app" x="38" y="110" width="1924" height="145" opacity="0.32"/>
  <rect class="lane codec" x="38" y="255" width="1924" height="155" opacity="0.32"/>
  <rect class="lane session" x="38" y="410" width="1924" height="190" opacity="0.32"/>
  <rect class="lane core" x="38" y="600" width="1924" height="140" opacity="0.32"/>

  <text class="lane-title" x="58" y="141">应用层</text>
  <text class="small" x="58" y="165">策略与缓冲区所有者</text>
  <text class="lane-title" x="58" y="287">工件与编解码</text>
  <text class="small" x="58" y="311">元数据、映射与帧转换</text>
  <text class="lane-title" x="58" y="443">会话层</text>
  <text class="small" x="58" y="467">NoC / IRQ / 屏障</text>
  <text class="lane-title" x="58" y="633">PAICORE</text>
  <text class="small" x="58" y="657">配置、输入、计算、输出</text>

  <!-- Deployment: public call plus the work it owns across lanes. -->
  <rect class="box app" x="190" y="149" width="230" height="76"/>
  <text class="box-title" x="210" y="177">工件 + 自有缓冲区</text>
  <text class="small" x="210" y="204">artifact · input · output</text>

  <rect class="box codec" x="470" y="291" width="246" height="84"/>
  <circle class="step-codec" cx="493" cy="314" r="13"/>
  <text class="step" x="493" y="314">1</text>
  <text class="box-title" x="516" y="320">读取运行契约</text>
  <text class="small" x="490" y="350">runtime + I/O mappings</text>

  <rect class="box session" x="470" y="452" width="246" height="112"/>
  <text class="box-title" x="490" y="480">部署一次</text>
  <text class="api" x="490" y="505"><tspan x="490">rvrt_paicore_runner_</tspan><tspan x="490" dy="18">deploy(config)</tspan></text>
  <text class="small" x="490" y="548">session init + load config</text>

  <rect class="box core" x="485" y="635" width="216" height="72"/>
  <text class="box-title" x="505" y="664">加载静态配置</text>
  <text class="small" x="505" y="689">config frames</text>

  <path class="arrow" d="M420 187 H445 V333 H470"/>
  <path class="arrow" d="M593 375 V452"/>
  <path class="arrow" d="M593 564 V635"/>

  <!-- Sample runner internals remain inside the same swimlanes. -->
  <rect class="runner-boundary" x="750" y="276" width="1110" height="448"/>
  <rect class="chip-codec" x="770" y="265" width="480" height="26"/>
  <text class="label" x="785" y="283">run_sample() 内部：分段输入 + 每段独立完成屏障</text>

  <rect class="box app" x="780" y="144" width="260" height="88"/>
  <text class="box-title" x="800" y="172">运行一个独立样本</text>
  <text class="api" x="800" y="197"><tspan x="800">rvrt_paicore_runner_</tspan><tspan x="800" dy="18">run_sample()</tspan></text>

  <rect class="box session" x="805" y="452" width="210" height="94"/>
  <circle class="step-session" cx="828" cy="476" r="13"/>
  <text class="step" x="828" y="476">2</text>
  <text class="box-title" x="851" y="482">样本复位</text>
  <text class="api" x="825" y="520">reset_model()</text>

  <rect class="box core" x="805" y="635" width="210" height="72"/>
  <text class="box-title" x="825" y="664">重置模型状态</text>
  <text class="small" x="825" y="689">INIT → COMPLETE</text>

  <rect class="box codec" x="1035" y="301" width="236" height="84"/>
  <circle class="step-codec" cx="1058" cy="325" r="13"/>
  <text class="step" x="1058" y="325">3</text>
  <text class="box-title" x="1081" y="331">编码当前输入段</text>
  <text class="small" x="1055" y="359">按 application t 循环</text>

  <rect class="box session" x="1035" y="452" width="236" height="94"/>
  <text class="box-title" x="1055" y="480">发送当前输入段</text>
  <text class="api" x="1055" y="505"><tspan x="1055">send_input_</tspan><tspan x="1055" dy="18">timestep()</tspan></text>

  <rect class="box core" x="1035" y="635" width="236" height="72"/>
  <text class="box-title" x="1055" y="664">写入输入工作帧</text>
  <text class="small" x="1055" y="689">绝对逻辑时间戳</text>

  <rect class="box session" x="1315" y="452" width="250" height="104"/>
  <circle class="step-session" cx="1338" cy="476" r="13"/>
  <text class="step" x="1338" y="476">4</text>
  <text class="box-title" x="1361" y="482">完成同步</text>
  <text class="api" x="1335" y="507"><tspan x="1335">sync_wait_until()</tspan><tspan x="1335" dy="18">+ runner RX handler</tspan></text>
  <text class="small" x="1335" y="546">每个 SYNC 均等待 COMPLETE</text>

  <rect class="box core" x="1315" y="635" width="250" height="72"/>
  <text class="box-title" x="1335" y="664">推进计算并返回输出</text>
  <text class="small" x="1335" y="689">WORK frames → COMPLETE</text>

  <rect class="box codec" x="1610" y="291" width="230" height="94"/>
  <circle class="step-codec" cx="1633" cy="315" r="13"/>
  <text class="step" x="1633" y="315">5</text>
  <text class="box-title" x="1656" y="321">IRQ 增量解码</text>
  <text class="small" x="1630" y="350">DATA / VOLTAGE</text>
  <text class="small" x="1630" y="374">直接散写 output[t][element]</text>

  <rect class="box app" x="1610" y="144" width="230" height="88"/>
  <text class="box-title" x="1630" y="172">完整样本输出</text>
  <text class="small" x="1630" y="198">[T][output elements]</text>
  <text class="small" x="1630" y="219">应用后处理</text>

  <path class="arrow" d="M700 671 H735 V188 H780"/>
  <path class="arrow" d="M910 232 V452"/>
  <path class="arrow" d="M910 546 V635"/>
  <path class="arrow" d="M1015 671 H1025 V343 H1035"/>
  <path class="arrow" d="M1153 385 V452"/>
  <path class="arrow" d="M1153 546 V635"/>
  <path class="arrow" d="M1271 671 H1293 V504 H1315"/>
  <path class="arrow" d="M1440 556 V635"/>
  <path class="arrow" d="M1565 671 H1587 V338 H1610"/>
  <path class="arrow" d="M1725 291 V232"/>

  <!-- Advanced manual path, kept subordinate to the runner. -->
  <text class="title" x="52" y="790" style="font-size:23px">高级手工路径：保留原始帧与完整窗口批量解码</text>
  <line class="divider" x1="52" y1="808" x2="1948" y2="808"/>
  <rect class="manual-boundary" x="52" y="828" width="1896" height="190"/>

  <rect class="box session" x="82" y="858" width="265" height="92"/>
  <text class="box-title" x="102" y="885">会话准备与样本复位</text>
  <text class="api" x="102" y="912">init · load_config · reset</text>
  <text class="small" x="102" y="937">应用显式管理 RX storage</text>

  <rect class="box codec" x="390" y="858" width="245" height="92"/>
  <text class="box-title" x="410" y="885">发送 T 个输入行</text>
  <text class="api" x="410" y="912"><tspan x="410">send_input_</tspan><tspan x="410" dy="18">timestep() × T</tspan></text>

  <rect class="box session" x="678" y="858" width="245" height="92"/>
  <text class="box-title" x="698" y="885">等待完成目标</text>
  <text class="api" x="698" y="912">sync_wait_until()</text>
  <text class="small" x="698" y="937">严格递增的 timeline target</text>

  <rect class="box session" x="966" y="858" width="220" height="92"/>
  <text class="box-title" x="986" y="885">保留原始 RX 帧</text>
  <text class="small" x="986" y="912">WORK + COMPLETE</text>
  <text class="small" x="986" y="937">受 rx_capacity 限制</text>

  <rect class="box codec" x="1229" y="858" width="260" height="92"/>
  <text class="box-title" x="1249" y="885">完整窗口批量解码</text>
  <text class="api" x="1249" y="912"><tspan x="1249">rvrt_decode_output_</tspan><tspan x="1249" dy="18">frames()</tspan></text>

  <rect class="box app" x="1532" y="858" width="250" height="92"/>
  <text class="box-title" x="1552" y="885">STREAM DATA 输出</text>
  <text class="small" x="1552" y="912">output[t][element]</text>
  <text class="small" x="1552" y="937">应用决定后处理策略</text>

  <path class="manual-arrow" d="M347 904 H390"/>
  <path class="manual-arrow" d="M635 904 H678"/>
  <path class="manual-arrow" d="M923 904 H966"/>
  <path class="manual-arrow" d="M1186 904 H1229"/>
  <path class="manual-arrow" d="M1489 904 H1532"/>

  <rect class="chip-app" x="82" y="974" width="510" height="28"/>
  <text class="label" x="97" y="993">应用所有权：artifact · tensor · frame buffer · voltage state</text>
  <rect class="chip-session" x="620" y="974" width="520" height="28"/>
  <text class="label" x="635" y="993">同步语义：completion_sync_timestep 是绝对 timeline target</text>
  <rect class="chip-codec" x="1168" y="974" width="614" height="28"/>
  <text class="label" x="1183" y="993">Runner：WORK 帧在 IRQ 中解码，不占用完整窗口 RX buffer</text>

  <rect class="event" x="52" y="1044" width="1896" height="82"/>
  <text class="box-title" x="72" y="1074">边界与约束</text>
  <text class="small" x="72" y="1103">单 active session · Runner 面向一个 I/O mapping pair · DATA 与 VOLTAGE 均支持 · raw-payload barrier 用于协议实验或其他 raw-payload 调用方 · 模型后处理留在应用层</text>
</svg>
